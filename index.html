<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RemApp | Nexus Eye v25.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305; --accent: #00f2ff; --danger: #ff003c; --success: #00ff88;
            --panel: rgba(12, 15, 20, 0.85); --border: rgba(0, 242, 255, 0.2);
            --text-main: #ffffff; --text-dim: rgba(255, 255, 255, 0.5);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); font-family: 'JetBrains Mono', monospace; 
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
                              linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }
        .app-container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 140px; }
        .system-monitor { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .pill { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 0; font-size: 0.55rem; text-align: center; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }
        .pill.active { color: var(--success); border-color: var(--success); }
        .nexus-core { width: 110px; height: 110px; margin: 20px auto; position: relative; display: flex; align-items: center; justify-content: center; }
        .core-inner { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 30px var(--accent); transition: 0.3s; }
        .nexus-core.listening .core-inner { background: var(--danger); box-shadow: 0 0 50px var(--danger); animation: pulse 0.5s infinite; }
        .nexus-core.processing .core-inner { background: var(--success); box-shadow: 0 0 50px var(--success); animation: pulse 0.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .omnibox { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; color: #fff; font-family: inherit; margin-bottom: 20px; }
        .briefing-card { background: rgba(0,255,136,0.05); border-left: 3px solid var(--success); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(8,10,15,0.9); border: 1px solid var(--border); border-radius: 40px; padding: 15px; display: flex; justify-content: space-around; backdrop-filter: blur(10px); z-index: 1000; }
        .dock-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-dim); }
        .dock-btn.primary { color: var(--accent); font-size: 2rem; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal { background: #0a0c10; border: 1px solid var(--accent); padding: 20px; border-radius: 15px; width: 100%; text-align: center; }
        .btn-confirm { background: var(--accent); color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 800; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="overlay" id="modalConfirm">
        <div class="modal">
            <h3 style="font-family:'Orbitron'; color:var(--accent);">CONFIRMAR MISIÓN</h3>
            <input type="text" id="confTitle" class="omnibox">
            <input type="time" id="confTime" class="omnibox">
            <div style="display:flex; gap:10px;">
                <button class="btn-confirm" style="background:var(--danger);" onclick="cerrarModal()">ABORTAR</button>
                <button class="btn-confirm" onclick="guardarMision()">DESPLEGAR</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1 style="font-family:'Orbitron'; font-size:1.2rem;">REMAPP V25</h1>
            <div id="location-tag" style="font-size:0.7rem; color:var(--accent); border:1px solid var(--accent); padding:5px; border-radius:5px;" onclick="cambiarBaseManual()">MADRID</div>
        </header>

        <div class="system-monitor">
            <div class="pill active">VPN</div>
            <div id="pill-core" class="pill">CORE</div>
            <div id="pill-link" class="pill">LINK</div>
            <div id="pill-mic" class="pill">VOICE</div>
        </div>

        <div class="nexus-core" id="nexusCore">
            <div class="core-inner"></div>
        </div>
        <div id="nexus-status" style="text-align:center; font-size:0.6rem; letter-spacing:2px; color:var(--accent);">STANDBY</div>

        <input type="text" id="mainInput" class="omnibox" placeholder="Dicta una orden directa...">
        <div id="briefing-area"></div>
        <div id="misiones-lista"></div>
    </div>

    <nav class="dock">
        <button class="dock-btn" onclick="hablarUbicacion()">🛰️</button>
        <button class="dock-btn primary" onclick="activarEscucha()">🎙️</button>
        <button class="dock-btn" onclick="ejecutarExtraccion('noticias')">📰</button>
        <button class="dock-btn" onclick="purgarSistema()">🧹</button>
    </nav>

    <script>
        let db, recognition, swReg;
        let zona = localStorage.getItem('zona') || "Madrid";
        let isSystemBusy = false;
        const BUNKER_URL = "http://localhost:3000";

        // INICIALIZACIÓN
        (async function init() {
            abrirBaseDatos();
            registrarCentinela();
            initSpeech();
        })();

        function abrirBaseDatos() {
            const req = indexedDB.open("NexusOmegaDB", 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore("m", { keyPath: "id" });
            req.onsuccess = e => { db = e.target.result; document.getElementById('pill-core').classList.add('active'); renderMisiones(); };
        }

        async function registrarCentinela() {
            if ('serviceWorker' in navigator) {
                swReg = await navigator.serviceWorker.register('sw.js');
                navigator.serviceWorker.addEventListener('message', e => {
                    if(e.data.action === 'complete') borrarMision(e.data.id);
                });
            }
        }

        // MOTOR DE IA
        async function procesarOrdenDirecta(txt) {
            if(isSystemBusy || !txt.trim()) return;
            isSystemBusy = true;
            setEstado("Consultando...", "alert");
            document.getElementById('nexusCore').classList.add('processing');

            try {
                const res = await fetch(`${BUNKER_URL}/api/omega-command`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: txt })
                });
                const data = await res.json();
                
                hablar(data.msg);
                if(data.action === 'ALARM') {
                    document.getElementById('confTitle').value = data.params.task.toUpperCase();
                    document.getElementById('confTime').value = data.params.time;
                    document.getElementById('modalConfirm').style.display = 'flex';
                } else if(data.action === 'SEARCH') {
                    ejecutarExtraccion(data.params.query);
                } else {
                    mostrarBriefing(data.msg);
                    isSystemBusy = false;
                }
            } catch (e) {
                setEstado("Error Enlace", "alert");
                hablar("Error de conexión con el Búnker.");
                isSystemBusy = false;
            } finally {
                document.getElementById('nexusCore').classList.remove('processing');
            }
        }

        async function ejecutarExtraccion(tema) {
            try {
                const res = await fetch(`${BUNKER_URL}/api/news?q=${tema}`);
                const data = await res.json();
                if(data.articles && data.articles[0]) {
                    mostrarBriefing(data.articles[0].title);
                    hablar(data.articles[0].title);
                }
            } catch(e) { console.error(e); }
            isSystemBusy = false;
        }

        function mostrarBriefing(msg) {
            document.getElementById('briefing-area').innerHTML = `<div class="briefing-card">> ${msg}</div>`;
        }

        function guardarMision() {
            const h = document.getElementById('confTime').value.split(":");
            const target = new Date(); target.setHours(h[0], h[1], 0, 0);
            if(target < new Date()) target.setDate(target.getDate() + 1);
            const m = { id: Date.now(), t: document.getElementById('confTitle').value, target: target.getTime() };
            db.transaction("m", "readwrite").objectStore("m").add(m).oncomplete = () => {
                if(swReg) swReg.active.postMessage({ type: 'SCHEDULE_MISSION', ...m, delay: m.target - Date.now() });
                cerrarModal(); renderMisiones();
            };
        }

        function renderMisiones() {
            if(!db) return;
            db.transaction("m").objectStore("m").getAll().onsuccess = e => {
                document.getElementById('misiones-lista').innerHTML = e.target.result.map(m => `
                    <div style="background:var(--panel); padding:10px; margin-top:5px; border-radius:5px; display:flex; justify-content:space-between;">
                        <span>${m.t} (${new Date(m.target).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})</span>
                        <button onclick="borrarMision(${m.id})" style="background:none; border:none; color:var(--danger);">✕</button>
                    </div>`).join('');
            };
        }

        function borrarMision(id) { db.transaction("m", "readwrite").objectStore("m").delete(id).oncomplete = () => renderMisiones(); }
        function cerrarModal() { document.getElementById('modalConfirm').style.display = 'none'; isSystemBusy = false; setEstado("Standby", "success"); }
        function hablar(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; window.speechSynthesis.speak(u); }
        function setEstado(t, s) { const el = document.getElementById('nexus-status'); el.innerText = t.toUpperCase(); el.style.color = s === 'success' ? 'var(--success)' : 'var(--accent)'; }
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return;
            recognition = new SR(); recognition.lang = 'es-ES';
            recognition.onstart = () => { document.getElementById('nexusCore').classList.add('listening'); document.getElementById('pill-mic').classList.add('active'); };
            recognition.onend = () => { document.getElementById('nexusCore').classList.remove('listening'); document.getElementById('pill-mic').classList.remove('active'); };
            recognition.onresult = e => { const txt = e.results[0][0].transcript; document.getElementById('mainInput').value = txt; procesarOrdenDirecta(txt); };
        }
        function activarEscucha() { if(!isSystemBusy) recognition.start(); }
        function cambiarBaseManual() { const n = prompt("Nueva base:"); if(n) { zona = n; localStorage.setItem('zona', n); document.getElementById('location-tag').innerText = n.toUpperCase(); } }
        function hablarUbicacion() { hablar(`Base actual: ${zona}`); }
        function purgarSistema() { if(confirm("¿PURGAR?")) { indexedDB.deleteDatabase("NexusOmegaDB"); localStorage.clear(); location.reload(); } }
        document.getElementById('mainInput').addEventListener('keypress', e => { if(e.key === 'Enter') procesarOrdenDirecta(e.target.value); });
    </script>
</body>
</html>
