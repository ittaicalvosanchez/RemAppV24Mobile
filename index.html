<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEXUS EYE | Terminal V26</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010203; --accent: #00e5ff; --danger: #ff003c; --success: #00ff88; --warn: #ffaa00;
            --panel: rgba(5, 8, 12, 0.7); --border: rgba(0, 229, 255, 0.2);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            min-height: 100vh; overflow-x: hidden;
            background-image: linear-gradient(to bottom, rgba(1,2,3,0.8), rgba(1,2,3,0.95)), 
                              url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .app-container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 140px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .title { font-family:'Orbitron'; font-weight:900; font-size:1rem; color:var(--accent); letter-spacing: 2px; }
        .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 5px 10px; border-radius: 4px; font-size: 0.6rem; font-family: inherit; cursor: pointer; transition: 0.3s; }
        .btn-ghost:active { background: var(--accent); color: #000; }
        
        /* HUD Monitor */
        .monitor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .pill { background: var(--panel); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 8px 0; font-size: 0.5rem; text-align: center; color: rgba(255,255,255,0.3); letter-spacing: 1px; transition: 0.3s; }
        .pill.active { color: var(--success); border-color: rgba(0,255,136,0.3); }
        .pill.warn { color: var(--warn); border-color: rgba(255,170,0,0.3); }

        /* Núcleo Visual */
        .core-container { display: flex; justify-content: center; align-items: center; height: 120px; margin-bottom: 10px; }
        .core { width: 80px; height: 80px; border: 1px dashed var(--border); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; }
        .core::before { content: ''; position: absolute; width: 100%; height: 100%; border: 1px solid var(--accent); border-radius: 50%; animation: spin 10s linear infinite; opacity: 0.3; }
        .core-led { width: 30px; height: 30px; background: rgba(0, 229, 255, 0.2); border-radius: 50%; box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); transition: 0.4s ease-out; }
        .core.processing .core-led { background: var(--success); box-shadow: 0 0 40px var(--success); transform: scale(1.2); }
        .core.listening .core-led { background: var(--danger); box-shadow: 0 0 40px var(--danger); animation: pulseFast 0.5s infinite; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulseFast { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

        /* Consola y Status */
        .console-input { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; color: #fff; font-family: inherit; margin-bottom: 10px; outline: none; }
        .status-bar { font-size: 0.55rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; height: 15px; margin-bottom: 20px; opacity: 0.7; }
        .briefing { background: var(--panel); padding: 15px; border-radius: 6px; font-size: 0.8rem; border-left: 2px solid var(--success); line-height: 1.5; }

        /* Dock */
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(2,4,6,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 10px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(10px); }
        .dock-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.7; transition: 0.2s; }
        .dock-btn.main { font-size: 2.2rem; opacity: 1; transform: translateY(-10px); filter: drop-shadow(0 0 10px rgba(0,229,255,0.3)); }
        .dock-btn:active { transform: scale(0.9); }

        /* Modales UI (Silenciosos) */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity 0.3s; }
        .modal { background: var(--bg); border: 1px solid var(--border); padding: 25px; border-radius: 10px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,229,255,0.1); }
        .modal input { width: 100%; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); padding: 12px; color: #fff; font-family: inherit; margin-bottom: 15px; border-radius: 4px; outline: none; }
        .modal-row { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 4px; font-family: 'JetBrains Mono'; font-weight: 800; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="overlay" id="uiIpConfig">
        <div class="modal">
            <div class="title" style="margin-bottom:15px; font-size:0.8rem;">CONFIGURACIÓN DE ENLACE</div>
            <input type="text" id="inputIp" placeholder="Ej: 192.168.1.50">
            <div class="modal-row">
                <button class="btn-action" style="background:var(--panel); color:#fff;" onclick="cerrarUi('uiIpConfig')">CANCELAR</button>
                <button class="btn-action" style="background:var(--accent); color:#000;" onclick="guardarIp()">Sincronizar</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="uiMision">
        <div class="modal">
            <div class="title" style="margin-bottom:15px; font-size:0.8rem; color:var(--success);">NUEVA MISIÓN OMEGA</div>
            <input type="text" id="inputTarea">
            <input type="time" id="inputHora">
            <div class="modal-row">
                <button class="btn-action" style="background:var(--panel); color:var(--danger);" onclick="cerrarUi('uiMision')">ABORTAR</button>
                <button class="btn-action" style="background:var(--success); color:#000;" onclick="confirmarMision()">DESPLEGAR</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header>
            <div class="title">NEXUS EYE</div>
            <button id="btn-ip" class="btn-ghost" onclick="abrirUi('uiIpConfig')">📡 OFFLINE</button>
        </header>

        <div class="monitor">
            <div id="mon-link" class="pill">UPLINK</div>
            <div id="mon-voc" class="pill">AUDIO</div>
            <div id="mon-mem" class="pill">DATA</div>
        </div>

        <div class="core-container">
            <div class="core" id="visualCore"><div class="core-led"></div></div>
        </div>
        
        <input type="text" id="mainInput" class="console-input" placeholder="INGRESE COMANDO DE OPERACIONES..." autocomplete="off">
        <div id="statusBar" class="status-bar">> SISTEMA INICIADO. ESPERANDO ÓRDENES.</div>
        
        <div id="display-area">
            <div class="briefing" style="border-color: var(--accent); color: rgba(255,255,255,0.7);">
                Bienvenido, Comandante. Interfaz limpia cargada.
            </div>
        </div>

        <div id="lista-misiones" style="margin-top:20px;"></div>
    </div>

    <nav class="dock">
        <button class="dock-btn" onclick="chequearEnlace()">🛰️</button>
        <button class="dock-btn main" onclick="iniciarEscucha()">🎙️</button>
        <button class="dock-btn" onclick="limpiarCache()">⚙️</button>
    </nav>

    <script>
        let db, rec, bunkerIp = localStorage.getItem('bIp') || "";
        let isProcessing = false;

        // INICIALIZACIÓN SILENCIOSA
        (function init() {
            if(bunkerIp) document.getElementById('btn-ip').innerText = `📡 ${bunkerIp}`;
            initDB();
            initVoz();
            if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
            setInterval(chequearEnlace, 10000); // Ping silencioso cada 10s
            setTimeout(chequearEnlace, 500);
        })();

        // GESTIÓN DE UI SIN ALERTAS
        function setStatus(msg, logType = 'normal') {
            const bar = document.getElementById('statusBar');
            bar.innerText = `> ${msg}`;
            bar.style.color = logType === 'error' ? 'var(--danger)' : (logType === 'success' ? 'var(--success)' : 'var(--accent)');
        }
        function abrirUi(id) { 
            const el = document.getElementById(id); 
            el.style.display = 'flex'; 
            setTimeout(() => el.style.opacity = '1', 10); 
        }
        function cerrarUi(id) { 
            const el = document.getElementById(id); 
            el.style.opacity = '0'; 
            setTimeout(() => el.style.display = 'none', 300); 
        }

        // RED SILENCIOSA
        function guardarIp() {
            const val = document.getElementById('inputIp').value.trim();
            if(val) { bunkerIp = val; localStorage.setItem('bIp', bunkerIp); document.getElementById('btn-ip').innerText = `📡 ${bunkerIp}`; chequearEnlace(); }
            cerrarUi('uiIpConfig');
        }

        async function chequearEnlace() {
            if(!bunkerIp) { setStatus("IP de búnker no configurada.", "error"); return; }
            try {
                const res = await fetch(`http://${bunkerIp}:3000/api/news?q=test`, { signal: AbortSignal.timeout(2000) });
                if(res.ok) { document.getElementById('mon-link').className = 'pill active'; setStatus("Uplink estabilizado.", "success"); }
            } catch(e) {
                document.getElementById('mon-link').className = 'pill warn'; setStatus("Buscando señal de búnker...", "warn");
            }
        }

        // PROCESAMIENTO NÚCLEO
        async function enviarOrden(txt) {
            if(!txt || isProcessing) return;
            if(!bunkerIp) { abrirUi('uiIpConfig'); return; }
            
            isProcessing = true;
            document.getElementById('visualCore').className = 'core processing';
            setStatus("Calculando trayectoria de datos...", "normal");

            try {
                const res = await fetch(`http://${bunkerIp}:3000/api/omega-command`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: txt })
                });
                const data = await res.json();
                
                hablar(data.msg);
                document.getElementById('display-area').innerHTML = `<div class="briefing">> ${data.msg}</div>`;
                setStatus("Respuesta recibida.", "success");

                if(data.action === 'ALARM') {
                    document.getElementById('inputTarea').value = data.params.task;
                    document.getElementById('inputHora').value = data.params.time;
                    abrirUi('uiMision');
                } else if(data.action === 'SEARCH') {
                    extraerNoticias(data.params.query);
                }
            } catch(e) {
                setStatus("Fallo de telemetría. Enlace caído.", "error");
            } finally {
                document.getElementById('visualCore').className = 'core';
                isProcessing = false;
                document.getElementById('mainInput').value = '';
            }
        }

        async function extraerNoticias(tema) {
            try {
                const res = await fetch(`http://${bunkerIp}:3000/api/news?q=${tema}`);
                const data = await res.json();
                if(data.articles?.[0]) {
                    document.getElementById('display-area').innerHTML = `<div class="briefing" style="border-color:var(--accent);">[DATA]: ${data.articles[0].title}</div>`;
                }
            } catch(e) {}
        }

        // MEMORIA Y MISIONES
        function initDB() {
            const req = indexedDB.open("NexusProDB", 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore("m", {keyPath:"id"});
            req.onsuccess = e => { db = e.target.result; document.getElementById('mon-mem').className = 'pill active'; renderMisiones(); };
        }

        function confirmarMision() {
            const h = document.getElementById('inputHora').value.split(":");
            const t = new Date(); t.setHours(h[0], h[1], 0, 0);
            if(t < new Date()) t.setDate(t.getDate()+1);
            const m = { id: Date.now(), t: document.getElementById('inputTarea').value, target: t.getTime() };
            db.transaction("m","readwrite").objectStore("m").add(m).oncomplete = () => {
                navigator.serviceWorker.controller?.postMessage({type:'SCHEDULE', ...m, delay: m.target - Date.now()});
                cerrarUi('uiMision'); renderMisiones(); setStatus("Misión en cola.", "success");
            };
        }

        function renderMisiones() {
            if(!db) return;
            db.transaction("m").objectStore("m").getAll().onsuccess = e => {
                document.getElementById('lista-misiones').innerHTML = e.target.result.map(m => `
                    <div style="background:var(--panel); padding:10px 15px; border-radius:4px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-left: 2px solid var(--danger);">
                        <div>
                            <div style="font-size:0.7rem; font-weight:800; color:#fff;">${m.t.toUpperCase()}</div>
                            <div style="font-size:0.55rem; color:var(--accent); margin-top:3px;">OBJETIVO: ${new Date(m.target).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                        </div>
                        <button onclick="borrarMision(${m.id})" style="color:var(--text-dim); background:none; border:none; font-size:1rem;">×</button>
                    </div>`).join('');
            };
        }

        function borrarMision(id) { db.transaction("m","readwrite").objectStore("m").delete(id).oncomplete = () => { renderMisiones(); setStatus("Misión purgada."); }; }
        
        // VOZ
        function initVoz() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return;
            rec = new SR(); rec.lang = 'es-ES';
            rec.onstart = () => { 
                document.getElementById('visualCore').className = 'core listening'; 
                document.getElementById('mon-voc').className = 'pill active';
                setStatus("Micrófono abierto.", "warn");
            };
            rec.onend = () => { 
                document.getElementById('mon-voc').className = 'pill'; 
                if(!isProcessing) document.getElementById('visualCore').className = 'core';
            };
            rec.onresult = e => { enviarOrden(e.results[0][0].transcript); };
        }
        function iniciarEscucha() { try { rec.start(); } catch(e){} }
        function hablar(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=1.1; window.speechSynthesis.speak(u); }
        
        // TECLADO Y LIMPIEZA
        document.getElementById('mainInput').addEventListener('keypress', e => { if(e.key==='Enter') enviarOrden(e.target.value); });
        function limpiarCache() { 
            document.getElementById('display-area').innerHTML = `<div class="briefing" style="color:var(--danger); border-color:var(--danger); cursor:pointer;" onclick="localStorage.clear(); indexedDB.deleteDatabase('NexusProDB'); location.reload();">CONFIRMAR PURGA TOTAL DEL SISTEMA</div>`;
        }
    </script>
</body>
</html>
